<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Hercules</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F5F3">
<!-- GitHub Pages serves this for any address that isn't part of the app. Paths are absolute
     because it can be shown at any depth under /hercules/. -->
<link rel="icon" href="/hercules/icons/icon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 100 700; font-display: swap; src: url("/hercules/fonts/ibm-plex-sans-latin.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans Condensed"; font-weight: 700; font-display: swap; src: url("/hercules/fonts/ibm-plex-sans-condensed-700-latin.woff2") format("woff2"); }
  :root { --bg: #F3F5F3; --surface: #FFFFFF; --line: #DCE3DE; --fg: #0F1A13; --muted: #53615A; --accent: #127A43; --accent-ink: #FFFFFF; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0E1411; --surface: #151D18; --line: #23302A; --fg: #E7EFE9; --muted: #8EA095; --accent: #3CC27A; --accent-ink: #04140B; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 16px; }
  main { width: min(100%, 360px); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 28px 20px 20px; text-align: center; }
  .code { font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 64px; line-height: 1; letter-spacing: -1px; color: var(--accent); }
  h1 { font-size: 20px; margin: 12px 0 6px; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 15px; line-height: 1.45; }
  a.btn { display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 4px; background: var(--accent); color: var(--accent-ink);
    font-weight: 600; font-size: 16px; text-decoration: none; }
  a.btn:active { transform: scale(0.98); }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>This address isn’t part of Hercules.</p>
  <a class="btn" href="/hercules/#log">Go to Hercules</a>
</main>
</body>
</html>
