<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Hercules</title>
<meta name="description" content="Log sets fast, track PRs and bodyweight, and see your training calendar.">
<meta name="theme-color" content="#F3F5F3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hercules">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="view">
    <div id="track">
      <section class="pane" data-tab="log" tabindex="-1" aria-label="Log"></section>
      <section class="pane" data-tab="calendar" tabindex="-1" aria-label="Calendar"></section>
      <section class="pane" data-tab="prs" tabindex="-1" aria-label="Progress"></section>
      <section class="pane" data-tab="settings" tabindex="-1" aria-label="Settings"></section>
    </div>
  </main>
  <nav class="tabbar" aria-label="Main">
    <a href="#log" data-tab="log">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="14" height="14"/><path d="M10 6.5v7M6.5 10h7"/></svg>
      <span>Log</span>
    </a>
    <a href="#calendar" data-tab="calendar">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5"/><path d="M3 8.5h14M7 2.5v4M13 2.5v4"/></svg>
      <span>Calendar</span>
    </a>
    <a href="#prs" data-tab="prs">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 3v14h14"/><path d="M6 13l3.5-4 3 2.5L17 6"/><path d="M13.5 6H17v3.5"/></svg>
      <span>Progress</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 6h14M3 14h14"/><rect x="5.5" y="4" width="3" height="4" fill="currentColor" stroke="none"/><rect x="11.5" y="12" width="3" height="4" fill="currentColor" stroke="none"/></svg>
      <span>Settings</span>
    </a>
  </nav>
</div>
<div id="pr-banner" aria-live="polite"></div>
<div id="timer-overlay" hidden></div>
<div id="hold-overlay" hidden></div>
<div id="gp-overlay" hidden></div>
<div id="sheet-root" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="storage.js"></script>
<script src="prs.js"></script>
<script src="app.js"></script>
</body>
</html>
